name: SBOM and container scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scan so newly disclosed CVEs are caught against unchanged images.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM and vulnerability scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      # Report on every image even if one of them has findings.
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: statement-merge
            dockerfile: services/statement-merge/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.name }}:scan .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.name }}:scan
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.name }}.cyclonedx.json
          output-file: sbom-${{ matrix.name }}.cyclonedx.json

      - name: Scan SBOM for vulnerabilities with Grype
        id: grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: sbom-${{ matrix.name }}.cyclonedx.json
          output-format: sarif
          severity-cutoff: high
          fail-build: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          # Keeps each matrix image's alerts as a separate, independently
          # tracked result set instead of overwriting one another.
          category: grype-${{ matrix.name }}
