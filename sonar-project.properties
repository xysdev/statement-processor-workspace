sonar.organization=xysdev
sonar.projectKey=xysdev_statement-processor-workspace
sonar.projectName=statement-processor-workspace

# Source and test layout (npm workspaces monorepo)
sonar.sources=apps/web/src,services/statement-merge/src,packages/shared/src
sonar.tests=apps/web/src,services/statement-merge/src,packages/shared/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/server.ts,**/vite.config.ts,**/vitest.config.ts

# Coverage reports (LCOV, generated by `npm run test:coverage`)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,services/statement-merge/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info,services/statement-merge/coverage/lcov.info,packages/shared/coverage/lcov.info

sonar.sourceEncoding=UTF-8
